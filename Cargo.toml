[workspace]
resolver = "2"
members = ["crates/gait-core", "crates/gait-wasm"]

[workspace.dependencies]
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
