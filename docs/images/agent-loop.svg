<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-labelledby="title desc"><title id="title">One agent turn</title><desc id="desc">The turn copies state and adds the prompt. Before each model call it compacts once if over budget. It calls the model, runs requested tools in order and repeats. A final answer commits.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d5e86"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#182b43;font-size:14px} .heading{font-size:16px;font-weight:700}.small{font-size:12px;fill:#415773}.mono{font-family:Consolas,monospace;font-size:12px;fill:#182b43}.box{fill:#f2f6fb;stroke:#728aa5;stroke-width:1.5}.blue{fill:#e5f0ff;stroke:#356bbb;stroke-width:1.5}.green{fill:#e9f5ef;stroke:#388064;stroke-width:1.5}.amber{fill:#fff4df;stroke:#9a6a15;stroke-width:1.5}.red{fill:#fdecec;stroke:#a33a3a;stroke-width:1.5}.line{fill:none;stroke:#3d5e86;stroke-width:1.7;marker-end:url(#arrow)}.dash{fill:none;stroke:#3d5e86;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#arrow)}</style><rect width="600" height="320" fill="white"/><rect x="10" y="15" width="180" height="62" rx="7" class="box"/><text x="100.0" y="37" text-anchor="middle" class="heading">1. Start the turn</text><text x="100.0" y="57" text-anchor="middle" class="small">Copy state, add the prompt</text><rect x="210" y="15" width="180" height="62" rx="7" class="amber"/><text x="300.0" y="37" text-anchor="middle" class="heading">2. Compact if needed</text><text x="300.0" y="57" text-anchor="middle" class="small">Over budget: one summary</text><rect x="410" y="15" width="180" height="62" rx="7" class="box"/><text x="500.0" y="37" text-anchor="middle" class="heading">3. Call the model</text><text x="500.0" y="57" text-anchor="middle" class="small">Budget check first</text><polygon points="500,105 560,145 500,185 440,145" class="blue"/><text x="500" y="150" text-anchor="middle" class="">Tool calls?</text><rect x="210" y="115" width="180" height="62" rx="7" class="green"/><text x="300.0" y="137" text-anchor="middle" class="heading">4. Call the tools</text><text x="300.0" y="157" text-anchor="middle" class="small">In order, arguments checked</text><rect x="10" y="115" width="180" height="62" rx="7" class="box"/><text x="100.0" y="137" text-anchor="middle" class="heading">5. Add the results</text><text x="100.0" y="157" text-anchor="middle" class="small">To the working dialog</text><rect x="410" y="215" width="180" height="62" rx="7" class="green"/><text x="500.0" y="237" text-anchor="middle" class="heading">6. Commit the answer</text><text x="500.0" y="257" text-anchor="middle" class="small">History + prompt + answer</text><rect x="10" y="215" width="380" height="62" rx="7" class="amber"/><text x="200.0" y="237" text-anchor="middle" class="heading">Stop without commit</text><text x="200.0" y="257" text-anchor="middle" class="small">Cancel, error, cut-off tool call, budget, 10 calls</text><polyline points="190,46 207,46" class="line"/><polyline points="390,46 407,46" class="line"/><polyline points="500,77 500,102" class="line"/><polyline points="440,145 393,145" class="line"/><text x="418" y="138" text-anchor="middle" class="small">yes</text><polyline points="210,146 193,146" class="line"/><polyline points="100,115 100,98 300,98 300,80" class="line"/><text x="200" y="92" text-anchor="middle" class="small">next call</text><polyline points="500,185 500,212" class="line"/><text x="515" y="203" text-anchor="middle" class="small">no</text><text x="300" y="305" text-anchor="middle" class="small">Step 2 runs at most once in a turn. Nothing is sent again. Server actions are not rolled back.</text></svg>
