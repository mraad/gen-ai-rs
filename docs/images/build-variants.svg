<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-labelledby="title desc"><title id="title">Build variants</title><desc id="desc">Change in WASM bytes against the current build of 274,099 bytes. No panic hook: 1,876 bytes smaller. strip = true: 366 bytes larger. No SIMD: 2,287 bytes larger. No variant was applied.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d5e86"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#182b43;font-size:14px} .heading{font-size:16px;font-weight:700}.small{font-size:12px;fill:#415773}.mono{font-family:Consolas,monospace;font-size:12px;fill:#182b43}.box{fill:#f2f6fb;stroke:#728aa5;stroke-width:1.5}.blue{fill:#e5f0ff;stroke:#356bbb;stroke-width:1.5}.green{fill:#e9f5ef;stroke:#388064;stroke-width:1.5}.amber{fill:#fff4df;stroke:#9a6a15;stroke-width:1.5}.red{fill:#fdecec;stroke:#a33a3a;stroke-width:1.5}.line{fill:none;stroke:#3d5e86;stroke-width:1.7;marker-end:url(#arrow)}.axis{stroke:#182b43;stroke-width:1.5}</style><rect width="600" height="250" fill="white"/><text x="300" y="26" text-anchor="middle" class="heading">Change in WASM bytes against the current build (274,099)</text><line x1="300" y1="42" x2="300" y2="196" class="axis"/><text x="20" y="58" text-anchor="start" class="">No panic hook: −1,876 bytes (272,223)</text><rect x="136" y="66" width="164" height="20" class="amber"/><text x="20" y="110" text-anchor="start" class="">strip = true: +366 bytes (274,465)</text><rect x="300" y="118" width="32" height="20" class="red"/><text x="20" y="162" text-anchor="start" class="">No SIMD: +2,287 bytes (276,386)</text><rect x="300" y="170" width="200" height="20" class="red"/><text x="300" y="218" text-anchor="middle" class="">A bar to the left is a smaller file. No variant was applied.</text><text x="300" y="238" text-anchor="middle" class="small">Without the panic hook, a panic shows no message in the browser console.</text></svg>
