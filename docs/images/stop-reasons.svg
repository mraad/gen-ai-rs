<svg xmlns="http://www.w3.org/2000/svg" width="600" height="365" viewBox="0 0 600 365" role="img" aria-labelledby="title desc"><title id="title">Stop reasons</title><desc id="desc">A turn ends with one of six results. A text answer commits, also when it was cut at the output limit. A cut-off tool call, the model-call limit (default 50) without an answer, cancellation and errors do not commit.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d5e86"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#182b43;font-size:14px} .heading{font-size:16px;font-weight:700}.small{font-size:12px;fill:#415773}.mono{font-family:Consolas,monospace;font-size:12px;fill:#182b43}.box{fill:#f2f6fb;stroke:#728aa5;stroke-width:1.5}.blue{fill:#e5f0ff;stroke:#356bbb;stroke-width:1.5}.green{fill:#e9f5ef;stroke:#388064;stroke-width:1.5}.amber{fill:#fff4df;stroke:#9a6a15;stroke-width:1.5}.red{fill:#fdecec;stroke:#a33a3a;stroke-width:1.5}.line{fill:none;stroke:#3d5e86;stroke-width:1.7;marker-end:url(#arrow)}.dash{fill:none;stroke:#3d5e86;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#arrow)}</style><rect width="600" height="365" fill="white"/><rect x="200" y="12" width="200" height="50" rx="7" class="blue"/><text x="300.0" y="34" text-anchor="middle" class="heading">Model response</text><rect x="20" y="84" width="560" height="34" rx="6" class="green"/><text x="36" y="106" class="mono">end_turn</text><text x="230" y="106" class="small">Text answer</text><text x="566" y="106" text-anchor="end" class="small">Committed</text><rect x="20" y="126" width="560" height="34" rx="6" class="green"/><text x="36" y="148" class="mono">max_output_tokens</text><text x="230" y="148" class="small">Text cut at the output limit</text><text x="566" y="148" text-anchor="end" class="small">Committed</text><rect x="20" y="168" width="560" height="34" rx="6" class="red"/><text x="36" y="190" class="mono">max_output_tokens</text><text x="230" y="190" class="small">Tool call cut at the limit</text><text x="566" y="190" text-anchor="end" class="small">Not run, not committed</text><rect x="20" y="210" width="560" height="34" rx="6" class="red"/><text x="36" y="232" class="mono">max_model_turns</text><text x="230" y="232" class="small">Call limit (50), no answer</text><text x="566" y="232" text-anchor="end" class="small">Not committed</text><rect x="20" y="252" width="560" height="34" rx="6" class="red"/><text x="36" y="274" class="mono">cancelled</text><text x="230" y="274" class="small">cancel() called</text><text x="566" y="274" text-anchor="end" class="small">Not committed</text><rect x="20" y="294" width="560" height="34" rx="6" class="red"/><text x="36" y="316" class="mono">error</text><text x="230" y="316" class="small">HTTP, budget, empty answer</text><text x="566" y="316" text-anchor="end" class="small">Not committed</text><polyline points="300,62 300,81" class="line"/><text x="300" y="352" text-anchor="middle" class="small">stopReason is in the send() result and in the turn_end event.</text></svg>
