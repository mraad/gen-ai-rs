<svg xmlns="http://www.w3.org/2000/svg" width="600" height="275" viewBox="0 0 600 275" role="img" aria-labelledby="title desc"><title id="title">Compaction inside a turn</title><desc id="desc">Earlier turns become one summary system message. The current turn, from its user message onward, stays word for word. The cut is always at a user message.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d5e86"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#182b43;font-size:14px} .heading{font-size:16px;font-weight:700}.small{font-size:12px;fill:#415773}.mono{font-family:Consolas,monospace;font-size:12px;fill:#182b43}.box{fill:#f2f6fb;stroke:#728aa5;stroke-width:1.5}.blue{fill:#e5f0ff;stroke:#356bbb;stroke-width:1.5}.green{fill:#e9f5ef;stroke:#388064;stroke-width:1.5}.amber{fill:#fff4df;stroke:#9a6a15;stroke-width:1.5}.red{fill:#fdecec;stroke:#a33a3a;stroke-width:1.5}.line{fill:none;stroke:#3d5e86;stroke-width:1.7;marker-end:url(#arrow)}.dash{fill:none;stroke:#3d5e86;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#arrow)}</style><rect width="600" height="275" fill="white"/><text x="300" y="24" text-anchor="middle" class="heading">Before the summary</text><rect x="20" y="36" width="62" height="40" rx="5" class="box"/><text x="51.0" y="61" text-anchor="middle" class="">user 1</text><rect x="88" y="36" width="70" height="40" rx="5" class="box"/><text x="123.0" y="61" text-anchor="middle" class="">answer 1</text><rect x="164" y="36" width="62" height="40" rx="5" class="box"/><text x="195.0" y="61" text-anchor="middle" class="">user 2</text><rect x="232" y="36" width="70" height="40" rx="5" class="box"/><text x="267.0" y="61" text-anchor="middle" class="">answer 2</text><rect x="308" y="36" width="62" height="40" rx="5" class="blue"/><text x="339.0" y="61" text-anchor="middle" class="">user 3</text><rect x="376" y="36" width="70" height="40" rx="5" class="green"/><text x="411.0" y="61" text-anchor="middle" class="">tool call</text><rect x="452" y="36" width="92" height="40" rx="5" class="green"/><text x="498.0" y="61" text-anchor="middle" class="">tool result</text><polyline points="20,88 284,88" fill="none" stroke="#9a6a15" stroke-width="2"/><text x="152" y="104" text-anchor="middle" class="small">Earlier turns: summarized</text><polyline points="290,88 580,88" fill="none" stroke="#356bbb" stroke-width="2"/><text x="435" y="104" text-anchor="middle" class="small">Current turn: kept word for word</text><polyline points="300,114 300,140" class="line"/><text x="300" y="162" text-anchor="middle" class="heading">After the summary</text><rect x="20" y="174" width="264" height="40" rx="5" class="amber"/><text x="152.0" y="199" text-anchor="middle" class="">system: summary of earlier turns</text><rect x="290" y="174" width="62" height="40" rx="5" class="blue"/><text x="321.0" y="199" text-anchor="middle" class="">user 3</text><rect x="358" y="174" width="70" height="40" rx="5" class="green"/><text x="393.0" y="199" text-anchor="middle" class="">tool call</text><rect x="434" y="174" width="92" height="40" rx="5" class="green"/><text x="480.0" y="199" text-anchor="middle" class="">tool result</text><text x="300" y="240" text-anchor="middle" class="small">The cut is always at a user message, and never after the last user message.</text><text x="300" y="258" text-anchor="middle" class="small">A failed or empty summary leaves the dialog unchanged.</text></svg>
