<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">MCP request sequence</title><desc id="desc">The client lists tools, optionally requests more pages, then calls a named tool. Every request carries protocol metadata. Cancellation closes the response stream.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d5e86"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#182b43;font-size:15px} .heading{font-size:18px;font-weight:700}.small{font-size:13px;fill:#415773}.box{fill:#f2f6fb;stroke:#728aa5;stroke-width:1.5}.blue{fill:#e5f0ff;stroke:#356bbb;stroke-width:1.5}.green{fill:#e9f5ef;stroke:#388064;stroke-width:1.5}.amber{fill:#fff4df;stroke:#9a6a15;stroke-width:1.5}.line{fill:none;stroke:#3d5e86;stroke-width:1.7;marker-end:url(#arrow)}</style><rect width="720" height="400" fill="white"/><rect x="35" y="15" width="220" height="55" rx="7" class="blue"/><text x="145.0" y="40" text-anchor="middle" class="heading">Rust / WASM</text><rect x="465" y="15" width="220" height="55" rx="7" class="green"/><text x="575.0" y="40" text-anchor="middle" class="heading">Server /mcp</text><path d="M145 70V365M575 70V365" fill="none" stroke="#a0adbe" stroke-dasharray="4 5"/><polyline points="145,112 573,112" class="line"/><text x="360" y="100" text-anchor="middle" class="">POST tools/list + request metadata</text><polyline points="575,157 147,157" class="line"/><text x="360" y="145" text-anchor="middle" class="">Tool schemas + optional nextCursor</text><text x="360" y="192" text-anchor="middle" class="small">Repeat tools/list only when another page exists.</text><polyline points="145,238 573,238" class="line"/><text x="360" y="226" text-anchor="middle" class="">POST tools/call + name + arguments</text><polyline points="575,283 147,283" class="line"/><text x="360" y="271" text-anchor="middle" class="">JSON result or request-scoped SSE result</text><polyline points="145,338 573,338" class="line" stroke-dasharray="5 4"/><text x="360" y="326" text-anchor="middle" class="">Cancel: close the in-flight response stream</text><text x="360" y="388" text-anchor="middle" class="small">Protocol: 2026-07-28. No initialize exchange. No automatic POST retry.</text></svg>
