<svg xmlns="http://www.w3.org/2000/svg" width="600" height="345" viewBox="0 0 600 345" role="img" aria-labelledby="title desc"><title id="title">Query once in narrow.py</title><desc id="desc">narrow.py reads the column types with DESCRIBE, which does not run the query. It then runs the model SQL once into a temporary table with at most 100,001 rows. The GeoParquet file is a COPY from that table with 100,000 rows. The rows for the JSON sample, the statistics and the GeoJSON file come from the same table. A 100,001st row marks the result as truncated. The database is read-only and locked.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d5e86"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#182b43;font-size:14px} .heading{font-size:15px;font-weight:700}.small{font-size:12px;fill:#415773}.mono{font-family:Consolas,monospace;font-size:12px;fill:#182b43}.box{fill:#f2f6fb;stroke:#728aa5;stroke-width:1.5}.blue{fill:#e5f0ff;stroke:#356bbb;stroke-width:1.5}.green{fill:#e9f5ef;stroke:#388064;stroke-width:1.5}.amber{fill:#fff4df;stroke:#9a6a15;stroke-width:1.5}.red{fill:#fdecec;stroke:#a33a3a;stroke-width:1.5}.line{fill:none;stroke:#3d5e86;stroke-width:1.7;marker-end:url(#arrow)}.dash{fill:none;stroke:#3d5e86;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#arrow)}.life{stroke:#9aaabd;stroke-width:1.2;stroke-dasharray:3 4}</style><rect width="600" height="345" fill="white"/><text x="300" y="22" text-anchor="middle" class="small">The model SQL runs once. The rows and the file come from one temporary table.</text><rect x="10" y="40" width="180" height="70" rx="7" class="amber"/><text x="100.0" y="60" text-anchor="middle" class="heading">1. SQL</text><text x="100.0" y="78" text-anchor="middle" class="mono">SELECT ... (model SQL)</text><rect x="210" y="40" width="180" height="70" rx="7" class="box"/><text x="300.0" y="60" text-anchor="middle" class="heading">2. Column types</text><text x="300.0" y="78" text-anchor="middle" class="mono">DESCRIBE SELECT ...</text><text x="300.0" y="94" text-anchor="middle" class="small">types only, no rows</text><rect x="410" y="40" width="180" height="70" rx="7" class="green"/><text x="500.0" y="60" text-anchor="middle" class="heading">3. Run once</text><text x="500.0" y="78" text-anchor="middle" class="mono">CREATE TEMP TABLE</text><text x="500.0" y="94" text-anchor="middle" class="small">result ... LIMIT 100001</text><rect x="410" y="150" width="180" height="86" rx="7" class="blue"/><text x="500.0" y="170" text-anchor="middle" class="heading">4a. GeoParquet</text><text x="500.0" y="188" text-anchor="middle" class="mono">COPY (... FROM result</text><text x="500.0" y="204" text-anchor="middle" class="small">LIMIT 100000)</text><text x="500.0" y="220" text-anchor="middle" class="small">GEOPARQUET V1</text><rect x="210" y="150" width="180" height="86" rx="7" class="blue"/><text x="300.0" y="170" text-anchor="middle" class="heading">4b. Rows</text><text x="300.0" y="188" text-anchor="middle" class="mono">SELECT * REPLACE</text><text x="300.0" y="204" text-anchor="middle" class="small">(geometry) FROM result</text><text x="300.0" y="220" text-anchor="middle" class="small">JSON sample, stats</text><rect x="10" y="150" width="180" height="86" rx="7" class="blue"/><text x="100.0" y="170" text-anchor="middle" class="heading">4c. GeoJSON</text><text x="100.0" y="188" text-anchor="middle" class="small">FeatureCollection</text><text x="100.0" y="204" text-anchor="middle" class="small">from the rows</text><text x="100.0" y="220" text-anchor="middle" class="small">NAME.geojson</text><rect x="10" y="262" width="580" height="46" rx="7" class="red"/><text x="300.0" y="282" text-anchor="middle" class="small">Read-only database. TEMP tables are allowed; CREATE TABLE, file reads, ATTACH and SET fail.</text><polyline points="190,75 208,75" class="line"/><polyline points="390,75 408,75" class="line"/><polyline points="500,110 500,148" class="line"/><polyline points="450,110 330,148" class="line"/><polyline points="210,193 192,193" class="line"/><text x="300" y="330" text-anchor="middle" class="small">Row 100,001 exists: truncated is true. The file and the result keep 100,000 rows.</text></svg>