<svg xmlns="http://www.w3.org/2000/svg" width="600" height="245" viewBox="0 0 600 245" role="img" aria-labelledby="title desc"><title id="title">Context budget</title><desc id="desc">The context window holds the overhead of system text and tool schemas, the working dialog and a reserve. Before each model call the agent summarizes earlier turns once if the dialog is over budget.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d5e86"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#182b43;font-size:14px} .heading{font-size:16px;font-weight:700}.small{font-size:12px;fill:#415773}.mono{font-family:Consolas,monospace;font-size:12px;fill:#182b43}.box{fill:#f2f6fb;stroke:#728aa5;stroke-width:1.5}.blue{fill:#e5f0ff;stroke:#356bbb;stroke-width:1.5}.green{fill:#e9f5ef;stroke:#388064;stroke-width:1.5}.amber{fill:#fff4df;stroke:#9a6a15;stroke-width:1.5}.red{fill:#fdecec;stroke:#a33a3a;stroke-width:1.5}.line{fill:none;stroke:#3d5e86;stroke-width:1.7;marker-end:url(#arrow)}.dash{fill:none;stroke:#3d5e86;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#arrow)}</style><rect width="600" height="245" fill="white"/><text x="300" y="26" text-anchor="middle" class="heading">Configured context window W</text><rect x="20" y="42" width="160" height="70" class="blue"/><rect x="180" y="42" width="300" height="70" class="green"/><rect x="480" y="42" width="100" height="70" class="amber"/><text x="100" y="68" text-anchor="middle" class="heading">Overhead O</text><text x="100" y="90" text-anchor="middle" class="small">System text + tool schemas</text><text x="330" y="68" text-anchor="middle" class="heading">Working dialog D</text><text x="330" y="90" text-anchor="middle" class="small">History + prompt + tool results</text><text x="530" y="68" text-anchor="middle" class="heading">Reserve R</text><text x="530" y="90" text-anchor="middle" class="small">For the answer</text><text x="300" y="148" text-anchor="middle" class="">Before each model call: if D &gt; W − O − R, summarize the earlier turns.</text><text x="300" y="172" text-anchor="middle" class="">At most one summary in a turn. The current turn stays word for word.</text><text x="300" y="196" text-anchor="middle" class="">Then the request must fit in B = W − R, or the turn stops.</text><text x="300" y="228" text-anchor="middle" class="small">Not to scale. Token counts are estimates: about 4 bytes of JSON for each token.</text></svg>
