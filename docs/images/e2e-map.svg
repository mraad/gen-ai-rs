<svg xmlns="http://www.w3.org/2000/svg" width="600" height="310" viewBox="0 0 600 310" role="img" aria-labelledby="title desc"><title id="title">Browser test of the map page</title><desc id="desc">tools/e2e.py opens map.html in isolated Chrome through the real gateway. A fake mcp-rwee serves fixture files and a fake model on another origin asks for two layers. The ArcGIS SDK loads from the network.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d5e86"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#182b43;font-size:14px} .heading{font-size:16px;font-weight:700}.small{font-size:12px;fill:#415773}.mono{font-family:Consolas,monospace;font-size:12px;fill:#182b43}.box{fill:#f2f6fb;stroke:#728aa5;stroke-width:1.5}.blue{fill:#e5f0ff;stroke:#356bbb;stroke-width:1.5}.green{fill:#e9f5ef;stroke:#388064;stroke-width:1.5}.amber{fill:#fff4df;stroke:#9a6a15;stroke-width:1.5}.red{fill:#fdecec;stroke:#a33a3a;stroke-width:1.5}.line{fill:none;stroke:#3d5e86;stroke-width:1.7;marker-end:url(#arrow)}.dash{fill:none;stroke:#3d5e86;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#arrow)}</style><rect width="600" height="310" fill="white"/><rect x="10" y="20" width="160" height="110" rx="7" class="blue"/><text x="90.0" y="42" text-anchor="middle" class="heading">Isolated Chrome</text><text x="90.0" y="62" text-anchor="middle" class="small">map.html</text><text x="90.0" y="79" text-anchor="middle" class="small">Clicks the format,</text><text x="90.0" y="96" text-anchor="middle" class="small">asks one question</text><rect x="220" y="20" width="160" height="110" rx="7" class="green"/><text x="300.0" y="42" text-anchor="middle" class="heading">Real gateway</text><text x="300.0" y="62" text-anchor="middle" class="small">tools/gateway.py</text><text x="300.0" y="79" text-anchor="middle" class="small">narrow mode</text><rect x="430" y="20" width="160" height="110" rx="7" class="amber"/><text x="510.0" y="42" text-anchor="middle" class="heading">FakeRwee</text><text x="510.0" y="62" text-anchor="middle" class="small">write and execute</text><text x="510.0" y="79" text-anchor="middle" class="small">fixtures/map files</text><text x="510.0" y="96" text-anchor="middle" class="small">HEAD and Range</text><rect x="220" y="170" width="160" height="80" rx="7" class="amber"/><text x="300.0" y="192" text-anchor="middle" class="heading">FakeMapModel</text><text x="300.0" y="212" text-anchor="middle" class="small">Other origin, CORS</text><text x="300.0" y="229" text-anchor="middle" class="small">Tool call, then answer</text><rect x="430" y="170" width="160" height="80" rx="7" class="box"/><text x="510.0" y="192" text-anchor="middle" class="heading">Network</text><text x="510.0" y="212" text-anchor="middle" class="small">js.arcgis.com</text><text x="510.0" y="229" text-anchor="middle" class="small">Basemap tiles</text><polyline points="170,75 217,75" class="line"/><text x="194" y="68" text-anchor="middle" class="small">/mcp</text><polyline points="380,75 427,75" class="line"/><text x="404" y="68" text-anchor="middle" class="small">token</text><polyline points="90,130 90,210 217,210" class="line"/><text x="150" y="203" text-anchor="middle" class="small">model</text><polyline points="130,130 130,150 470,150 490,167" class="dash"/><text x="300" y="145" text-anchor="middle" class="small">SDK</text><text x="300" y="278" text-anchor="middle" class="small">Checks for GeoParquet, then GeoJSON: the format sent, the files drawn,</text><text x="300" y="295" text-anchor="middle" class="small">the answer, no page errors, and 0 prefix breaks.</text></svg>
