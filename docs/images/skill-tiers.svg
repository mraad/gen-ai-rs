<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">Three levels of skill disclosure</title><desc id="desc">The catalog loads at startup. Activation fetches one instruction body. A resource tool fetches one listed file. Active names and hashes survive replay.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d5e86"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#182b43;font-size:15px} .heading{font-size:18px;font-weight:700}.small{font-size:13px;fill:#415773}.box{fill:#f2f6fb;stroke:#728aa5;stroke-width:1.5}.blue{fill:#e5f0ff;stroke:#356bbb;stroke-width:1.5}.green{fill:#e9f5ef;stroke:#388064;stroke-width:1.5}.amber{fill:#fff4df;stroke:#9a6a15;stroke-width:1.5}.line{fill:none;stroke:#3d5e86;stroke-width:1.7;marker-end:url(#arrow)}</style><rect width="720" height="380" fill="white"/><rect x="35" y="20" width="650" height="78" rx="7" class="blue"/><text x="360.0" y="45" text-anchor="middle" class="heading">1. Catalog at startup</text><text x="360.0" y="67" text-anchor="middle" class="small">Name, description, hash, resource paths. Instruction bodies are absent.</text><rect x="85" y="143" width="550" height="78" rx="7" class="green"/><text x="360.0" y="168" text-anchor="middle" class="heading">2. Instructions on activation</text><text x="360.0" y="190" text-anchor="middle" class="small">activate_skill fetches instructions.md for one skill.</text><rect x="135" y="266" width="450" height="78" rx="7" class="green"/><text x="360.0" y="291" text-anchor="middle" class="heading">3. One resource on request</text><text x="360.0" y="313" text-anchor="middle" class="small">read_skill_resource fetches one listed UTF-8 file.</text><polyline points="360,98 360,140" class="line"/><text x="462" y="126" text-anchor="middle" class="small">Model selects a skill</text><polyline points="360,221 360,263" class="line"/><text x="478" y="248" text-anchor="middle" class="small">Active skill + exact path</text><text x="360" y="370" text-anchor="middle" class="small">Active names and hashes are stored. Bodies are cached separately.</text></svg>
