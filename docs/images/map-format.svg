<svg xmlns="http://www.w3.org/2000/svg" width="600" height="255" viewBox="0 0 600 255" role="img" aria-labelledby="title desc"><title id="title">One map file format for each question</title><desc id="desc">The page sends its format in a header. The gateway checks it and passes it to narrow.py, which writes only that file. The page draws the file with the matching layer and reads it through the gateway.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d5e86"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#182b43;font-size:14px} .heading{font-size:16px;font-weight:700}.small{font-size:12px;fill:#415773}.mono{font-family:Consolas,monospace;font-size:12px;fill:#182b43}.box{fill:#f2f6fb;stroke:#728aa5;stroke-width:1.5}.blue{fill:#e5f0ff;stroke:#356bbb;stroke-width:1.5}.green{fill:#e9f5ef;stroke:#388064;stroke-width:1.5}.amber{fill:#fff4df;stroke:#9a6a15;stroke-width:1.5}.red{fill:#fdecec;stroke:#a33a3a;stroke-width:1.5}.line{fill:none;stroke:#3d5e86;stroke-width:1.7;marker-end:url(#arrow)}.dash{fill:none;stroke:#3d5e86;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#arrow)}</style><rect width="600" height="255" fill="white"/><text x="300" y="25" text-anchor="middle" class="small">One question, one format. The model does not choose the format.</text><rect x="10" y="40" width="108" height="86" rx="7" class="blue"/><text x="64.0" y="62" text-anchor="middle" class="heading">1. Page</text><text x="64.0" y="82" text-anchor="middle" class="small">Switch sets</text><text x="64.0" y="99" text-anchor="middle" class="small">X-Gait-Format</text><polyline points="118,83 127,83" class="line"/><rect x="128" y="40" width="108" height="86" rx="7" class="green"/><text x="182.0" y="62" text-anchor="middle" class="heading">2. Gateway</text><text x="182.0" y="82" text-anchor="middle" class="small">Accepts only</text><text x="182.0" y="99" text-anchor="middle" class="small">geojson, parquet</text><polyline points="236,83 245,83" class="line"/><rect x="246" y="40" width="108" height="86" rx="7" class="green"/><text x="300.0" y="62" text-anchor="middle" class="heading">3. Script</text><text x="300.0" y="82" text-anchor="middle" class="small">narrow.py</text><text x="300.0" y="99" text-anchor="middle" class="small">gets the format</text><polyline points="354,83 363,83" class="line"/><rect x="364" y="40" width="108" height="86" rx="7" class="green"/><text x="418.0" y="62" text-anchor="middle" class="heading">4. One file</text><text x="418.0" y="82" text-anchor="middle" class="small">NAME.geojson</text><text x="418.0" y="99" text-anchor="middle" class="small">or NAME.parquet</text><polyline points="472,83 481,83" class="line"/><rect x="482" y="40" width="108" height="86" rx="7" class="blue"/><text x="536.0" y="62" text-anchor="middle" class="heading">5. Page</text><text x="536.0" y="82" text-anchor="middle" class="small">GeoJSONLayer</text><text x="536.0" y="99" text-anchor="middle" class="small">or ParquetLayer</text><rect x="15" y="160" width="570" height="80" rx="7" class="box"/><text x="300.0" y="182" text-anchor="middle" class="heading">File requests from the map</text><text x="300.0" y="202" text-anchor="middle" class="small">GeoJSONLayer: GET. ParquetLayer: HEAD for the size, then GET with Range.</text><text x="300.0" y="219" text-anchor="middle" class="small">The gateway streams each file from mcp-rwee with no size limit.</text><polyline points="536,126 536,157" class="dash"/></svg>
