<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-labelledby="title desc"><title id="title">Host-owned observability</title><desc id="desc">Rust emits events to an onEvent callback. The host controls rendering, retention, redaction, and export. Rust retains no event log.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d5e86"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#182b43;font-size:15px} .heading{font-size:18px;font-weight:700}.small{font-size:13px;fill:#415773}.box{fill:#f2f6fb;stroke:#728aa5;stroke-width:1.5}.blue{fill:#e5f0ff;stroke:#356bbb;stroke-width:1.5}.green{fill:#e9f5ef;stroke:#388064;stroke-width:1.5}.amber{fill:#fff4df;stroke:#9a6a15;stroke-width:1.5}.line{fill:none;stroke:#3d5e86;stroke-width:1.7;marker-end:url(#arrow)}</style><rect width="720" height="310" fill="white"/><rect x="20" y="72" width="190" height="110" rx="7" class="blue"/><text x="115.0" y="97" text-anchor="middle" class="heading">Rust / WASM</text><text x="115.0" y="119" text-anchor="middle" class="small">turn, model, tool,</text><text x="115.0" y="139" text-anchor="middle" class="small">compaction, error events</text><rect x="285" y="88" width="165" height="80" rx="7" class="box"/><text x="367.5" y="113" text-anchor="middle" class="heading">onEvent</text><text x="367.5" y="135" text-anchor="middle" class="small">Synchronous callback</text><rect x="525" y="30" width="175" height="235" rx="7" class="green"/><text x="612.5" y="55" text-anchor="middle" class="heading">Host application</text><text x="612.5" y="77" text-anchor="middle" class="small">Render status</text><text x="612.5" y="97" text-anchor="middle" class="small">Redact stored data</text><text x="612.5" y="117" text-anchor="middle" class="small">Bound retained events</text><text x="612.5" y="137" text-anchor="middle" class="small">Export selected events</text><polyline points="210,127 282,127" class="line"/><polyline points="450,127 522,127" class="line"/><text x="115" y="220" text-anchor="middle" class="small">No retained event buffer</text><text x="360" y="295" text-anchor="middle" class="small">Demo retention: at most 200 events and 262,144 stored text characters.</text></svg>
