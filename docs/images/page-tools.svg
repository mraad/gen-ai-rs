<svg xmlns="http://www.w3.org/2000/svg" width="600" height="445" viewBox="0 0 600 445" role="img" aria-labelledby="title desc"><title id="title">Page tool call in one turn</title><desc id="desc">The page registers a tool. At the start of each turn the WASM agent lists the page tools with getTools and offers them to the model with the MCP and skill tools. When the model calls a page tool, the agent calls executeTool with an abort signal. The browser runs the tool in the page and returns a JSON string. The agent adds it to the dialog as a tool message. Cancel aborts the signal.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d5e86"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#182b43;font-size:14px} .heading{font-size:15px;font-weight:700}.small{font-size:12px;fill:#415773}.mono{font-family:Consolas,monospace;font-size:12px;fill:#182b43}.box{fill:#f2f6fb;stroke:#728aa5;stroke-width:1.5}.blue{fill:#e5f0ff;stroke:#356bbb;stroke-width:1.5}.green{fill:#e9f5ef;stroke:#388064;stroke-width:1.5}.amber{fill:#fff4df;stroke:#9a6a15;stroke-width:1.5}.red{fill:#fdecec;stroke:#a33a3a;stroke-width:1.5}.line{fill:none;stroke:#3d5e86;stroke-width:1.7;marker-end:url(#arrow)}.dash{fill:none;stroke:#3d5e86;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#arrow)}.life{stroke:#9aaabd;stroke-width:1.2;stroke-dasharray:3 4}</style><rect width="600" height="445" fill="white"/><rect x="7" y="12" width="136" height="32" rx="7" class="blue"/><text x="75" y="33" text-anchor="middle" class="heading">Page script</text><line x1="75" y1="44" x2="75" y2="420" class="life"/><rect x="157" y="12" width="136" height="32" rx="7" class="green"/><text x="225" y="33" text-anchor="middle" class="heading">modelContext</text><line x1="225" y1="44" x2="225" y2="420" class="life"/><rect x="307" y="12" width="136" height="32" rx="7" class="green"/><text x="375" y="33" text-anchor="middle" class="heading">WASM agent</text><line x1="375" y1="44" x2="375" y2="420" class="life"/><rect x="457" y="12" width="136" height="32" rx="7" class="amber"/><text x="525" y="33" text-anchor="middle" class="heading">Model</text><line x1="525" y1="44" x2="525" y2="420" class="life"/><polyline points="81,70 219,70" class="line"/><text x="150.0" y="64" text-anchor="middle" class="small">1 registerTool(tool)</text><polyline points="369,104 231,104" class="line"/><text x="300.0" y="98" text-anchor="middle" class="small">2 getTools() at turn start</text><polyline points="231,138 369,138" class="dash"/><text x="300.0" y="132" text-anchor="middle" class="small">3 name, description, inputSchema</text><polyline points="381,172 519,172" class="line"/><text x="450.0" y="166" text-anchor="middle" class="small">4 request: MCP, skill and page tools</text><polyline points="519,206 381,206" class="dash"/><text x="450.0" y="200" text-anchor="middle" class="small">5 tool call map_set_zoom</text><polyline points="369,240 231,240" class="line"/><text x="300.0" y="234" text-anchor="middle" class="small">6 executeTool(tool, input, {signal})</text><polyline points="219,274 81,274" class="line"/><text x="150.0" y="268" text-anchor="middle" class="small">7 execute(input, {signal})</text><polyline points="81,308 219,308" class="dash"/><text x="150.0" y="302" text-anchor="middle" class="small">8 return value</text><polyline points="231,342 369,342" class="dash"/><text x="300.0" y="336" text-anchor="middle" class="small">9 JSON string, then tool message</text><polyline points="381,376 519,376" class="line"/><text x="450.0" y="370" text-anchor="middle" class="small">10 next request with the result</text><text x="300" y="435" text-anchor="middle" class="small">Cancel drops the call: the agent aborts the signal, and the page tool sees signal.aborted.</text></svg>