<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title desc"><title id="title">Prompt prefix in one turn</title><desc id="desc">Three model calls in one turn. Each request starts with the same tool schemas, system text, history and prompt as the request before, and adds one tool call and its result at the end.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d5e86"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#182b43;font-size:14px} .heading{font-size:16px;font-weight:700}.small{font-size:12px;fill:#415773}.mono{font-family:Consolas,monospace;font-size:12px;fill:#182b43}.box{fill:#f2f6fb;stroke:#728aa5;stroke-width:1.5}.blue{fill:#e5f0ff;stroke:#356bbb;stroke-width:1.5}.green{fill:#e9f5ef;stroke:#388064;stroke-width:1.5}.amber{fill:#fff4df;stroke:#9a6a15;stroke-width:1.5}.red{fill:#fdecec;stroke:#a33a3a;stroke-width:1.5}.line{fill:none;stroke:#3d5e86;stroke-width:1.7;marker-end:url(#arrow)}.axis{stroke:#182b43;stroke-width:1.5}</style><rect width="600" height="300" fill="white"/><text x="300" y="26" text-anchor="middle" class="heading">One turn: each request extends the request before</text><text x="20" y="66" text-anchor="start" class="">Call 1</text><rect x="76" y="44" width="96" height="34" rx="4" class="box"/><text x="124.0" y="65.0" text-anchor="middle" class="small">Tool schemas</text><rect x="172" y="44" width="96" height="34" rx="4" class="blue"/><text x="220.0" y="65.0" text-anchor="middle" class="small">System text</text><rect x="268" y="44" width="80" height="34" rx="4" class="green"/><text x="308.0" y="65.0" text-anchor="middle" class="small">History</text><rect x="348" y="44" width="60" height="34" rx="4" class="green"/><text x="378.0" y="65.0" text-anchor="middle" class="small">Prompt</text><text x="20" y="114" text-anchor="start" class="">Call 2</text><rect x="76" y="92" width="96" height="34" rx="4" class="box"/><text x="124.0" y="113.0" text-anchor="middle" class="small">Tool schemas</text><rect x="172" y="92" width="96" height="34" rx="4" class="blue"/><text x="220.0" y="113.0" text-anchor="middle" class="small">System text</text><rect x="268" y="92" width="80" height="34" rx="4" class="green"/><text x="308.0" y="113.0" text-anchor="middle" class="small">History</text><rect x="348" y="92" width="60" height="34" rx="4" class="green"/><text x="378.0" y="113.0" text-anchor="middle" class="small">Prompt</text><rect x="408" y="92" width="86" height="34" rx="4" class="amber"/><text x="451.0" y="113.0" text-anchor="middle" class="small">Call + result</text><text x="20" y="162" text-anchor="start" class="">Call 3</text><rect x="76" y="140" width="96" height="34" rx="4" class="box"/><text x="124.0" y="161.0" text-anchor="middle" class="small">Tool schemas</text><rect x="172" y="140" width="96" height="34" rx="4" class="blue"/><text x="220.0" y="161.0" text-anchor="middle" class="small">System text</text><rect x="268" y="140" width="80" height="34" rx="4" class="green"/><text x="308.0" y="161.0" text-anchor="middle" class="small">History</text><rect x="348" y="140" width="60" height="34" rx="4" class="green"/><text x="378.0" y="161.0" text-anchor="middle" class="small">Prompt</text><rect x="408" y="140" width="86" height="34" rx="4" class="amber"/><text x="451.0" y="161.0" text-anchor="middle" class="small">Call + result</text><rect x="494" y="140" width="86" height="34" rx="4" class="amber"/><text x="537.0" y="161.0" text-anchor="middle" class="small">Call + result</text><text x="300" y="204" text-anchor="middle" class="">The start of each request has the same bytes as the request before.</text><text x="300" y="226" text-anchor="middle" class="">The provider can read that start from its prompt cache.</text><text x="300" y="256" text-anchor="middle" class="small">The start changes when a skill becomes active, when a summary replaces</text><text x="300" y="274" text-anchor="middle" class="small">the history, or when a new turn starts without the earlier tool messages.</text></svg>
