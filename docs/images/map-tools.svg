<svg xmlns="http://www.w3.org/2000/svg" width="600" height="370" viewBox="0 0 600 370" role="img" aria-labelledby="title desc"><title id="title">Map page tools</title><desc id="desc">The model chooses tools. The WASM agent sends data tool calls to the gateway on /mcp, which relays them to mcp-rwee. It sends page tool calls through document.modelContext, native or from modelcontext.js, to map.js. map.js changes the ArcGIS MapView and reads map files from /artifacts through the gateway.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d5e86"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#182b43;font-size:14px} .heading{font-size:15px;font-weight:700}.small{font-size:12px;fill:#415773}.mono{font-family:Consolas,monospace;font-size:12px;fill:#182b43}.box{fill:#f2f6fb;stroke:#728aa5;stroke-width:1.5}.blue{fill:#e5f0ff;stroke:#356bbb;stroke-width:1.5}.green{fill:#e9f5ef;stroke:#388064;stroke-width:1.5}.amber{fill:#fff4df;stroke:#9a6a15;stroke-width:1.5}.red{fill:#fdecec;stroke:#a33a3a;stroke-width:1.5}.line{fill:none;stroke:#3d5e86;stroke-width:1.7;marker-end:url(#arrow)}.dash{fill:none;stroke:#3d5e86;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#arrow)}.life{stroke:#9aaabd;stroke-width:1.2;stroke-dasharray:3 4}</style><rect width="600" height="370" fill="white"/><rect x="10" y="40" width="150" height="72" rx="7" class="amber"/><text x="85.0" y="60" text-anchor="middle" class="heading">Model</text><text x="85.0" y="78" text-anchor="middle" class="small">chooses tools</text><rect x="225" y="40" width="150" height="72" rx="7" class="green"/><text x="300.0" y="60" text-anchor="middle" class="heading">WASM agent</text><text x="300.0" y="78" text-anchor="middle" class="small">one loop, sequential</text><text x="300.0" y="94" text-anchor="middle" class="small">tool calls</text><rect x="440" y="20" width="150" height="52" rx="7" class="green"/><text x="515.0" y="40" text-anchor="middle" class="heading">Gateway</text><text x="515.0" y="58" text-anchor="middle" class="mono">/mcp, same origin</text><rect x="440" y="100" width="150" height="52" rx="7" class="box"/><text x="515.0" y="120" text-anchor="middle" class="heading">mcp-rwee</text><text x="515.0" y="138" text-anchor="middle" class="small">NAME_query, files</text><rect x="225" y="175" width="150" height="72" rx="7" class="green"/><text x="300.0" y="195" text-anchor="middle" class="heading">modelContext</text><text x="300.0" y="213" text-anchor="middle" class="small">getTools()</text><text x="300.0" y="229" text-anchor="middle" class="small">executeTool()</text><rect x="225" y="285" width="150" height="72" rx="7" class="blue"/><text x="300.0" y="305" text-anchor="middle" class="heading">map.js</text><text x="300.0" y="323" text-anchor="middle" class="small">9 map_* tools</text><text x="300.0" y="339" text-anchor="middle" class="small">addFile, draw()</text><rect x="440" y="285" width="150" height="72" rx="7" class="blue"/><text x="515.0" y="305" text-anchor="middle" class="heading">MapView</text><text x="515.0" y="323" text-anchor="middle" class="small">layers, zoom,</text><text x="515.0" y="339" text-anchor="middle" class="small">extent</text><rect x="10" y="175" width="150" height="72" rx="7" class="box"/><text x="85.0" y="195" text-anchor="middle" class="heading">Native WebMCP</text><text x="85.0" y="213" text-anchor="middle" class="small">or modelcontext.js</text><text x="85.0" y="229" text-anchor="middle" class="small">when absent</text><polyline points="160,70 223,70" class="line"/><polyline points="225,84 162,84" class="dash"/><polyline points="375,55 438,46" class="line"/><polyline points="515,72 515,98" class="line"/><polyline points="300,112 300,173" class="line"/><polyline points="300,247 300,283" class="line"/><polyline points="375,321 438,321" class="line"/><polyline points="375,300 470,155" class="dash"/><polyline points="160,211 223,211" class="dash"/><text x="300" y="14" text-anchor="middle" class="small">Data tools go to /mcp. Map tools run in the page.</text><text x="525" y="222" text-anchor="middle" class="small">map_add_* reads</text><text x="525" y="238" text-anchor="middle" class="small">/artifacts/RUN/NAME</text><text x="525" y="254" text-anchor="middle" class="small">through the gateway</text></svg>