<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">Browser and server responsibilities</title><desc id="desc">The host application calls Rust in the browser. Rust gets assets and sends model and MCP requests. The server owns tool execution.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d5e86"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#182b43;font-size:15px} .heading{font-size:18px;font-weight:700}.small{font-size:13px;fill:#415773}.box{fill:#f2f6fb;stroke:#728aa5;stroke-width:1.5}.blue{fill:#e5f0ff;stroke:#356bbb;stroke-width:1.5}.green{fill:#e9f5ef;stroke:#388064;stroke-width:1.5}.amber{fill:#fff4df;stroke:#9a6a15;stroke-width:1.5}.line{fill:none;stroke:#3d5e86;stroke-width:1.7;marker-end:url(#arrow)}</style><rect width="720" height="380" fill="white"/><rect x="15" y="15" width="410" height="340" rx="7" class="box"/><text x="220.0" y="40" text-anchor="middle" class="heading">Browser</text><rect x="450" y="15" width="255" height="340" rx="7" class="box"/><text x="577.5" y="40" text-anchor="middle" class="heading">Same-origin server</text><rect x="45" y="64" width="335" height="65" rx="7" class="blue"/><text x="212.5" y="89" text-anchor="middle" class="heading">Host application</text><text x="212.5" y="111" text-anchor="middle" class="small">UI, onEvent, onDelta, state()</text><rect x="45" y="183" width="335" height="79" rx="7" class="blue"/><text x="212.5" y="208" text-anchor="middle" class="heading">Rust / WASM</text><text x="212.5" y="230" text-anchor="middle" class="small">Agent loop, skills, context budget</text><text x="212" y="300" text-anchor="middle" class="small">Conversation and skill state</text><text x="212" y="323" text-anchor="middle" class="small">One active turn per session</text><rect x="477" y="65" width="201" height="65" rx="7" class="box"/><text x="577.5" y="90" text-anchor="middle" class="heading">Static assets</text><text x="577.5" y="112" text-anchor="middle" class="small">HTML, JS, WASM, skills</text><rect x="477" y="172" width="201" height="65" rx="7" class="green"/><text x="577.5" y="197" text-anchor="middle" class="heading">Model proxy</text><text x="577.5" y="219" text-anchor="middle" class="small">Optional; holds model key</text><rect x="477" y="279" width="201" height="60" rx="7" class="green"/><text x="577.5" y="304" text-anchor="middle" class="heading">MCP /mcp</text><text x="577.5" y="326" text-anchor="middle" class="small">Authorized server tools</text><polyline points="477,98 382,98" class="line"/><text x="430" y="83" text-anchor="middle" class="small">GET</text><polyline points="212,130 212,180" class="line"/><text x="259" y="158" text-anchor="middle" class="small">send()</text><polyline points="45,222 28,222 28,153 105,153 105,132" class="line"/><text x="80" y="172" text-anchor="middle" class="small">events</text><polyline points="380,206 474,206" class="line"/><text x="429" y="192" text-anchor="middle" class="small">model</text><polyline points="380,241 433,241 433,309 474,309" class="line"/><text x="431" y="275" text-anchor="middle" class="small">tools</text></svg>
