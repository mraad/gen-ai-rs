<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title desc"><title id="title">Review result</title><desc id="desc">Five topics were compared with current sources on 12 November 2026. MCP, WebMCP, compaction and the prompt cache needed no change. Three WASM size variants were measured and none was applied.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d5e86"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#182b43;font-size:14px} .heading{font-size:16px;font-weight:700}.small{font-size:12px;fill:#415773}.mono{font-family:Consolas,monospace;font-size:12px;fill:#182b43}.box{fill:#f2f6fb;stroke:#728aa5;stroke-width:1.5}.blue{fill:#e5f0ff;stroke:#356bbb;stroke-width:1.5}.green{fill:#e9f5ef;stroke:#388064;stroke-width:1.5}.amber{fill:#fff4df;stroke:#9a6a15;stroke-width:1.5}.red{fill:#fdecec;stroke:#a33a3a;stroke-width:1.5}.line{fill:none;stroke:#3d5e86;stroke-width:1.7;marker-end:url(#arrow)}.axis{stroke:#182b43;stroke-width:1.5}</style><rect width="600" height="300" fill="white"/><text x="300" y="24" text-anchor="middle" class="heading">Review of 12 November 2026</text><rect x="20" y="38" width="150" height="36" rx="4" class="blue"/><text x="95.0" y="60.0" text-anchor="middle" class="">MCP 2026-07-28</text><path d="M170 56H206" class="line"/><rect x="208" y="38" width="372" height="36" rx="4" class="green"/><text x="394.0" y="60.0" text-anchor="middle" class="small">Latest revision. Each required field is sent.</text><rect x="20" y="84" width="150" height="36" rx="4" class="blue"/><text x="95.0" y="106.0" text-anchor="middle" class="">WebMCP</text><path d="M170 102H206" class="line"/><rect x="208" y="84" width="372" height="36" rx="4" class="green"/><text x="394.0" y="106.0" text-anchor="middle" class="small">Draft uses objects. Chrome 153 uses strings. Retry stays.</text><rect x="20" y="130" width="150" height="36" rx="4" class="blue"/><text x="95.0" y="152.0" text-anchor="middle" class="">Compaction</text><path d="M170 148H206" class="line"/><rect x="208" y="130" width="372" height="36" rx="4" class="green"/><text x="394.0" y="152.0" text-anchor="middle" class="small">Threshold, kept recent turns, merged summary: present.</text><rect x="20" y="176" width="150" height="36" rx="4" class="blue"/><text x="95.0" y="198.0" text-anchor="middle" class="">Prompt cache</text><path d="M170 194H206" class="line"/><rect x="208" y="176" width="372" height="36" rx="4" class="green"/><text x="394.0" y="198.0" text-anchor="middle" class="small">The request start is stable in a turn. A test checks it.</text><rect x="20" y="222" width="150" height="36" rx="4" class="blue"/><text x="95.0" y="244.0" text-anchor="middle" class="">WASM size</text><path d="M170 240H206" class="line"/><rect x="208" y="222" width="372" height="36" rx="4" class="green"/><text x="394.0" y="244.0" text-anchor="middle" class="small">Three variants measured. None applied.</text><text x="300" y="288" text-anchor="middle" class="small">Result: three small deletions. A skill name is now limited to 128 characters.</text></svg>
