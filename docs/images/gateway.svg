<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">Gateway between the map page and mcp-rwee</title><desc id="desc">The map page and the WASM agent call the gateway on the same origin. The gateway checks arguments, adds the token and relays tool calls and map files from mcp-rwee. Model requests go to the model proxy.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d5e86"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#182b43;font-size:14px} .heading{font-size:16px;font-weight:700}.small{font-size:12px;fill:#415773}.mono{font-family:Consolas,monospace;font-size:12px;fill:#182b43}.box{fill:#f2f6fb;stroke:#728aa5;stroke-width:1.5}.blue{fill:#e5f0ff;stroke:#356bbb;stroke-width:1.5}.green{fill:#e9f5ef;stroke:#388064;stroke-width:1.5}.amber{fill:#fff4df;stroke:#9a6a15;stroke-width:1.5}.red{fill:#fdecec;stroke:#a33a3a;stroke-width:1.5}.line{fill:none;stroke:#3d5e86;stroke-width:1.7;marker-end:url(#arrow)}.dash{fill:none;stroke:#3d5e86;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#arrow)}</style><rect width="600" height="360" fill="white"/><rect x="15" y="15" width="170" height="300" rx="7" class="box"/><text x="100.0" y="37" text-anchor="middle" class="heading">Browser</text><rect x="30" y="55" width="140" height="70" rx="7" class="blue"/><text x="100.0" y="77" text-anchor="middle" class="heading">map.html</text><text x="100.0" y="97" text-anchor="middle" class="small">Map, layers, trace</text><rect x="30" y="175" width="140" height="80" rx="7" class="blue"/><text x="100.0" y="197" text-anchor="middle" class="heading">WASM agent</text><text x="100.0" y="217" text-anchor="middle" class="small">Model calls,</text><text x="100.0" y="234" text-anchor="middle" class="small">tool calls, skills</text><rect x="225" y="15" width="170" height="300" rx="7" class="box"/><text x="310.0" y="37" text-anchor="middle" class="heading">Gateway</text><rect x="240" y="55" width="140" height="120" rx="7" class="green"/><text x="310.0" y="77" text-anchor="middle" class="heading">tools/gateway.py</text><text x="310.0" y="97" text-anchor="middle" class="small">localhost:8080</text><text x="310.0" y="114" text-anchor="middle" class="small">Checks arguments</text><text x="310.0" y="131" text-anchor="middle" class="small">Adds the token</text><text x="310.0" y="148" text-anchor="middle" class="small">Relays map files</text><rect x="435" y="15" width="150" height="190" rx="7" class="box"/><text x="510.0" y="37" text-anchor="middle" class="heading">mcp-rwee</text><rect x="448" y="55" width="124" height="60" rx="7" class="green"/><text x="510.0" y="77" text-anchor="middle" class="heading">northsea.py</text><text x="510.0" y="97" text-anchor="middle" class="small">write, execute</text><rect x="448" y="130" width="124" height="60" rx="7" class="green"/><text x="510.0" y="152" text-anchor="middle" class="heading">DuckDB</text><text x="510.0" y="172" text-anchor="middle" class="small">Read-only, locked</text><rect x="435" y="230" width="150" height="85" rx="7" class="green"/><text x="510.0" y="252" text-anchor="middle" class="heading">Model proxy</text><text x="510.0" y="272" text-anchor="middle" class="small">tools/dev_proxy.py</text><text x="510.0" y="289" text-anchor="middle" class="small">Holds the model key</text><polyline points="170,205 237,160" class="line"/><text x="210" y="208" text-anchor="middle" class="small">/mcp</text><polyline points="237,80 173,80" class="dash"/><text x="199" y="50" text-anchor="middle" class="small">/artifacts</text><polyline points="380,85 445,85" class="line"/><text x="412" y="78" text-anchor="middle" class="small">token</text><polyline points="510,115 510,127" class="line"/><polyline points="445,165 383,150" class="dash"/><text x="412" y="175" text-anchor="middle" class="small">map file</text><polyline points="170,240 205,240 205,330 510,330 510,318" class="line"/><text x="360" y="345" text-anchor="middle" class="small">model requests (CORS)</text></svg>
