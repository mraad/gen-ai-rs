<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240" role="img" aria-labelledby="title desc"><title id="title">Save and restore a session</title><desc id="desc">The page passes the saved value to create, runs turns, reads state and saves it in localStorage after each turn. A reload restores it. Clear removes the saved value and empties the session.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d5e86"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#182b43;font-size:14px} .heading{font-size:16px;font-weight:700}.small{font-size:12px;fill:#415773}.mono{font-family:Consolas,monospace;font-size:12px;fill:#182b43}.box{fill:#f2f6fb;stroke:#728aa5;stroke-width:1.5}.blue{fill:#e5f0ff;stroke:#356bbb;stroke-width:1.5}.green{fill:#e9f5ef;stroke:#388064;stroke-width:1.5}.amber{fill:#fff4df;stroke:#9a6a15;stroke-width:1.5}.red{fill:#fdecec;stroke:#a33a3a;stroke-width:1.5}.line{fill:none;stroke:#3d5e86;stroke-width:1.7;marker-end:url(#arrow)}.dash{fill:none;stroke:#3d5e86;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#arrow)}</style><rect width="600" height="240" fill="white"/><rect x="10" y="20" width="170" height="66" rx="7" class="blue"/><text x="95.0" y="42" text-anchor="middle" class="heading">1. create()</text><text x="95.0" y="62" text-anchor="middle" class="small">state: the saved value</text><text x="95.0" y="79" text-anchor="middle" class="small">or nothing</text><rect x="215" y="20" width="170" height="66" rx="7" class="green"/><text x="300.0" y="42" text-anchor="middle" class="heading">2. send()</text><text x="300.0" y="62" text-anchor="middle" class="small">One turn commits</text><text x="300.0" y="79" text-anchor="middle" class="small">to the session</text><rect x="420" y="20" width="170" height="66" rx="7" class="box"/><text x="505.0" y="42" text-anchor="middle" class="heading">3. state()</text><text x="505.0" y="62" text-anchor="middle" class="small">{ dialog, scratchpad }</text><rect x="420" y="130" width="170" height="66" rx="7" class="amber"/><text x="505.0" y="152" text-anchor="middle" class="heading">4. Host storage</text><text x="505.0" y="172" text-anchor="middle" class="small">The page uses</text><text x="505.0" y="189" text-anchor="middle" class="small">localStorage</text><rect x="10" y="130" width="300" height="66" rx="7" class="red"/><text x="160.0" y="152" text-anchor="middle" class="heading">Clear</text><text x="160.0" y="172" text-anchor="middle" class="small">Remove the saved value,</text><text x="160.0" y="189" text-anchor="middle" class="small">then session.clear()</text><polyline points="180,53 212,53" class="line"/><polyline points="385,53 417,53" class="line"/><polyline points="505,86 505,127" class="line"/><text x="525" y="110" text-anchor="middle" class="small">save</text><polyline points="420,163 330,163 330,100 95,100 95,89" class="line"/><text x="380" y="155" text-anchor="middle" class="small">page reload</text><text x="300" y="226" text-anchor="middle" class="small">A damaged saved value makes create() fail. Clear removes it, and the next connect starts empty.</text></svg>
